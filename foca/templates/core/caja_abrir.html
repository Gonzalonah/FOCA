{% extends 'base.html' %}
{% block title %}Abrir Caja{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h3>Abrir Caja</h3>
            </div>
            <div class="card-body">
                <p>Estado actual: <strong>{{ caja.estado }}</strong></p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="saldo_inicial" class="form-label">Saldo inicial ($)</label>
                        <input type="number" step="0.01" name="saldo_inicial" id="saldo_inicial" 
                               class="form-control" value="0" min="0" required>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success">Abrir Caja</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
