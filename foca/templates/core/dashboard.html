{% extends 'base.html' %}
{% block title %}Dashboard{% endblock %}

{% block content %}
<h1 class="mb-4">Dashboard de {{ emprendimiento.nombre }}</h1>

<div class="row">
    <div class="col-md-4">
        <div class="card text-white bg-primary mb-3">
            <div class="card-body">
                <h5 class="card-title">Total productos</h5>
                <p class="card-text display-6">{{ total_productos }}</p>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-white bg-warning mb-3">
            <div class="card-body">
                <h5 class="card-title">Stock bajo</h5>
                <p class="card-text display-6">{{ stock_bajo }}</p>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-white bg-success mb-3">
            <div class="card-body">
                <h5 class="card-title">Saldo en caja</h5>
                <p class="card-text display-6">${{ saldo_caja }}</p>
            </div>
        </div>
    </div>
</div>

<!-- Aquí luego agregaremos gráficos y más estadísticas -->
{% endblock %}
